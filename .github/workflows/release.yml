name: Release FleurTerm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Universal
            platform: macos-14
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows x64
            platform: windows-latest
            targets: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        run: pnpm version:check

      - name: Read annotated tag release notes
        id: release_notes
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" != 'tag' ]]; then
            echo "Release tag ${RELEASE_TAG} must be annotated." >&2
            exit 1
          fi

          release_notes="$(git for-each-ref --format='%(contents:body)' "refs/tags/${RELEASE_TAG}")"
          if ! grep -Eq '^1[.] .+' <<< "${release_notes}"; then
            echo "Release tag ${RELEASE_TAG} must include English numbered release notes." >&2
            exit 1
          fi

          delimiter="FLEURTERM_RELEASE_NOTES_$(node -p "require('node:crypto').randomUUID()")"
          {
            echo "body<<${delimiter}"
            printf '%s\n' "${release_notes}"
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build signed updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_UPDATER_ENABLED: 'true'
        with:
          tagName: v__VERSION__
          releaseName: FleurTerm v__VERSION__
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
